<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Resume Builder</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f4f4f4;

            font-family: Arial, sans-serif;
        }


        .login-container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                    0 5px 25px
                    rgba(0,0,0,0.12);
        }


        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 30px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 5px;

            margin-bottom: 18px;

            font-size: 15px;
        }


        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {

            background: #444;
        }


        .message {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 5px;

            text-align: center;
        }


        .success {

            background: #e7f7e7;

            color: #176b17;
        }


        .error {

            background: #ffe7e7;

            color: #a00000;
        }


        .signup-link {

            text-align: center;

            margin-top: 20px;
        }


        .signup-link a {

            color: #222;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>
        Resume Builder
    </h1>


    <div
            th:if="${param.registered}"
            class="message success">

        Account created successfully.
        Please login.

    </div>


    <div
            th:if="${param.error}"
            class="message error">

        Invalid email or password.

    </div>


    <div
            th:if="${param.logout}"
            class="message success">

        You have been logged out.

    </div>


    <form
            th:action="@{/login}"
            method="post">


        <label for="username">
            Email
        </label>


        <input
                type="email"
                id="username"
                name="username"
                placeholder="Enter your email"
                required>


        <label for="password">
            Password
        </label>


        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>


        <button type="submit">

            Login

        </button>


    </form>


    <div class="signup-link">

        Don't have an account?

        <a href="/signup">

            Create Account

        </a>

    </div>
    <div class="demo-login">
        <p>Want to explore the app first?</p>

        <a href="/demo-login" class="demo-button">
            Try Demo — No Registration Required
        </a>
    </div>

</div>


</body>

</html>
