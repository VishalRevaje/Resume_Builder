<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resume Form</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px;

            background: #f2f2f2;

            font-family: Arial, sans-serif;
        }


        .container {

            max-width: 1000px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 8px;
        }


        h1 {

            margin-top: 0;
        }


        h2 {

            margin-top: 35px;

            border-bottom: 1px solid #ddd;

            padding-bottom: 8px;
        }


        h3 {

            margin-top: 10px;
        }


        .form-group {

            margin-bottom: 15px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 5px;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 9px;

            border: 1px solid #ccc;

            border-radius: 4px;

            font-size: 14px;
        }


        textarea {

            min-height: 120px;

            resize: vertical;
        }


        .two-column {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        .three-column {

            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            gap: 15px;
        }


        .item {

            border: 1px solid #ddd;

            padding: 20px;

            margin-bottom: 15px;

            border-radius: 5px;

            background: #fafafa;
        }


        button,
        .button {

            padding: 9px 16px;

            border: none;

            border-radius: 4px;

            background: #333;

            color: white;

            cursor: pointer;

            text-decoration: none;

            display: inline-block;

            font-size: 14px;
        }


        button:hover,
        .button:hover {

            background: #555;
        }


        .remove-button {

            background: #b00020;

            margin-top: 10px;
        }


        .toolbar {

            display: flex;

            gap: 5px;

            margin-bottom: 8px;
        }


        .toolbar button {

            padding: 6px 10px;

            font-weight: bold;

            background: #555;
        }


        .editor {

            min-height: 150px;

            border: 1px solid #ccc;

            border-radius: 4px;

            padding: 12px;

            background: white;
        }


        .editor.empty::before {

            content: attr(data-placeholder);

            color: #888;

            pointer-events: none;
        }


        .actions {

            margin-top: 30px;

            display: flex;

            gap: 10px;
        }


        .save-button {

            background: #1976d2;
        }


        .preview-button {

            background: #388e3c;
        }


        /* =====================================================
           RESUME SECTION MANAGER
           ===================================================== */

        .section-manager {

            width: 100%;

            margin-bottom: 30px;

            padding: 20px;

            box-sizing: border-box;

            background: #f8f9fa;

            border: 1px solid #d9d9d9;

            border-radius: 10px;
        }


        .section-manager-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 15px;
        }


        .section-manager-header h2 {

            margin: 0 0 5px 0;

            font-size: 20px;
        }


        .section-manager-header p {

            margin: 0;

            color: #666;

            font-size: 13px;
        }


        .section-manager-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

            width: 100%;
        }


        .section-manager-item {

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            min-height: 65px;

            padding: 10px 12px;

            box-sizing: border-box;

            background: #ffffff;

            border: 1px solid #d4d4d4;

            border-radius: 7px;

            cursor: grab;

            transition:
                    opacity 0.15s ease,
                    background 0.15s ease,
                    border-color 0.15s ease,
                    transform 0.15s ease;
        }


        .section-manager-item:hover {

            border-color: #999;

            background: #fafafa;
        }


        .section-manager-item.dragging {

            opacity: 0.45;

            border-style: dashed;

            transform: scale(0.99);
        }


        .drag-handle {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 30px;

            min-width: 30px;

            font-size: 22px;

            line-height: 1;

            color: #555;

            cursor: grab;

            user-select: none;
        }


        .drag-handle:active {

            cursor: grabbing;
        }


        .section-manager-content {

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .section-manager-content label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #444;
        }


        .section-manager-content input {

            width: 100%;

            box-sizing: border-box;

            padding: 8px 10px;

            font-size: 14px;

            border: 1px solid #ccc;

            border-radius: 5px;

            outline: none;
        }


        .section-manager-content input:focus {

            border-color: #777;

            box-shadow:
                    0 0 0 2px
                    rgba(0, 0, 0, 0.05);
        }


        .resume-edit-section {

            width: 100%;
        }


        @media(max-width: 700px) {

            .two-column,
            .three-column {

                grid-template-columns: 1fr;
            }

            .section-manager-item {

                align-items: flex-start;
            }

            .drag-handle {

                padding-top: 8px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Resume Builder
    </h1>


    <form th:action="@{/resumes/save}"
          th:object="${resume}"
          method="post"
          id="resumeForm">


        <!-- =================================================
             PERSONAL INFORMATION
             ================================================= -->

        <h2>
            Personal Information
        </h2>


        <div class="two-column">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input type="text"
                       th:field="*{fullName}"
                       placeholder="Vishal Revaje"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input type="text"
                       th:field="*{location}"
                       placeholder="Solapur, Maharashtra">

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input type="email"
                       th:field="*{email}"
                       placeholder="revajevishal39@gmail.com">

            </div>


            <div class="form-group">

                <label>
                    Mobile
                </label>

                <input type="text"
                       th:field="*{mobile}"
                       placeholder="+91 9579906987">

            </div>


            <div class="form-group">

                <label>
                    LinkedIn
                </label>

                <input type="text"
                       th:field="*{linkedin}"
                       placeholder="linkedin.com/in/vishal-revaje-3b513622a">

            </div>


            <div class="form-group">

                <label>
                    GitHub
                </label>

                <input type="text"
                       th:field="*{github}"
                       placeholder="github.com/VishalRevaje">

            </div>


        </div>


        <!-- =================================================
             FONT SETTINGS
             ================================================= -->

        <h2>
            Resume Formatting
        </h2>


        <div class="two-column">


            <div class="form-group">

                <label>
                    Font Name
                </label>

                <select th:field="*{fontFamily}">

                    <option value="Arial">
                        Arial
                    </option>

                    <option value="Calibri">
                        Calibri
                    </option>

                    <option value="Times New Roman">
                        Times New Roman
                    </option>

                    <option value="Georgia">
                        Georgia
                    </option>

                    <option value="Verdana">
                        Verdana
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Font Size
                </label>

                <select th:field="*{fontSize}">

                    <option value="9">
                        9
                    </option>

                    <option value="10">
                        10
                    </option>

                    <option value="11">
                        11
                    </option>

                    <option value="12">
                        12
                    </option>

                    <option value="13">
                        13
                    </option>

                    <option value="14">
                        14
                    </option>

                </select>

            </div>


        </div>


        <!-- =================================================
             RESUME SECTION MANAGER
             ================================================= -->

        <div class="section-manager">

            <div class="section-manager-header">

                <div>
                    <h2>Resume Sections</h2>

                    <p>
                        Drag sections to change their order.
                        You can also rename the section headings.
                    </p>
                </div>

            </div>

            <input type="hidden"
                   id="sectionOrder"
                   th:field="*{sectionOrder}">

            <div id="sectionManager"
                 class="section-manager-list">

                <div class="section-manager-item"
                     data-section-key="summary"
                     draggable="true">

                    <div class="drag-handle"
                         title="Drag to reorder">
                        ☰
                    </div>

                    <div class="section-manager-content">

                        <label for="summaryTitle">
                            Section Heading
                        </label>

                        <input type="text"
                               id="summaryTitle"
                               th:field="*{summaryTitle}"
                               placeholder="Professional Summary">

                    </div>

                </div>


                <div class="section-manager-item"
                     data-section-key="education"
                     draggable="true">

                    <div class="drag-handle"
                         title="Drag to reorder">
                        ☰
                    </div>

                    <div class="section-manager-content">

                        <label for="educationTitle">
                            Section Heading
                        </label>

                        <input type="text"
                               id="educationTitle"
                               th:field="*{educationTitle}"
                               placeholder="Education">

                    </div>

                </div>


                <div class="section-manager-item"
                     data-section-key="skills"
                     draggable="true">

                    <div class="drag-handle"
                         title="Drag to reorder">
                        ☰
                    </div>

                    <div class="section-manager-content">

                        <label for="skillsTitle">
                            Section Heading
                        </label>

                        <input type="text"
                               id="skillsTitle"
                               th:field="*{skillsTitle}"
                               placeholder="Technical Skills">

                    </div>

                </div>


                <div class="section-manager-item"
                     data-section-key="projects"
                     draggable="true">

                    <div class="drag-handle"
                         title="Drag to reorder">
                        ☰
                    </div>

                    <div class="section-manager-content">

                        <label for="projectsTitle">
                            Section Heading
                        </label>

                        <input type="text"
                               id="projectsTitle"
                               th:field="*{projectsTitle}"
                               placeholder="Projects">

                    </div>

                </div>


                <div class="section-manager-item"
                     data-section-key="certifications"
                     draggable="true">

                    <div class="drag-handle"
                         title="Drag to reorder">
                        ☰
                    </div>

                    <div class="section-manager-content">

                        <label for="certificationsTitle">
                            Section Heading
                        </label>

                        <input type="text"
                               id="certificationsTitle"
                               th:field="*{certificationsTitle}"
                               placeholder="Certifications">

                    </div>

                </div>

            </div>

        </div>


        <div id="resumeSectionsContainer">


            <div
                    class="resume-edit-section"
                    data-section-key="summary"
            >

                <!-- =================================================
                     PROFESSIONAL SUMMARY
                     ================================================= -->

                <h2 id="section-title-summary">
                    Professional Summary
                </h2>


                <div class="toolbar">

                    <button type="button"
                            onclick="formatText('bold')">

                        B

                    </button>


                    <button type="button"
                            onclick="formatText('italic')">

                        I

                    </button>


                    <button type="button"
                            onclick="formatText('underline')">

                        U

                    </button>


                </div>


                <!-- Visible rich-text editor. The actual submitted value is kept
                     in summaryHidden and synchronized before the form is submitted. -->
                <div id="summaryEditor"
                     class="editor"
                     contenteditable="true"
                     role="textbox"
                     aria-multiline="true"
                     data-placeholder="Write your professional summary here..."></div>


                <!-- Spring/Thymeleaf-bound field. This is the field that is saved
                     to Resume.professionalSummary. -->
                <textarea id="summaryHidden"
                          th:field="*{professionalSummary}"
                          style="display:none;"></textarea>


            </div>


            <div
                    class="resume-edit-section"
                    data-section-key="education"
            >

                <!-- =================================================
                     EDUCATION
                     ================================================= -->

                <h2 id="section-title-education">
                    Education
                </h2>


                <div id="educationContainer">


                    <div class="item education-item"
                         th:each="education,stat : *{educations}">


                        <h3>
                            Education
                        </h3>


                        <div class="form-group">

                            <label>
                                Degree
                            </label>

                            <input type="text"
                                   th:field="*{educations[__${stat.index}__].degree}"
                                   placeholder="B.Tech in Electronics & Telecommunication Engineering">

                        </div>


                        <div class="form-group">

                            <label>
                                Institution
                            </label>

                            <input type="text"
                                   th:field="*{educations[__${stat.index}__].institution}"
                                   placeholder="N.K. Orchid College of Engineering">

                        </div>


                        <div class="two-column">


                            <div class="form-group">

                                <label>
                                    Location
                                </label>

                                <input type="text"
                                       th:field="*{educations[__${stat.index}__].location}"
                                       placeholder="Solapur">

                            </div>


                            <div class="form-group">

                                <label>
                                    Score
                                </label>

                                <input type="text"
                                       th:field="*{educations[__${stat.index}__].score}"
                                       placeholder="CGPA: 7.03/10">

                            </div>


                        </div>


                        <div class="two-column">


                            <div class="form-group">

                                <label>
                                    Start Year
                                </label>

                                <input type="text"
                                       th:field="*{educations[__${stat.index}__].startYear}"
                                       placeholder="2021">

                            </div>


                            <div class="form-group">

                                <label>
                                    End Year
                                </label>

                                <input type="text"
                                       th:field="*{educations[__${stat.index}__].endYear}"
                                       placeholder="2024">

                            </div>


                        </div>


                        <button type="button"
                                class="remove-button"
                                onclick="removeItem(this)">

                            Remove Education

                        </button>


                    </div>


                </div>


                <button type="button"
                        onclick="addEducation()">

                    + Add Education

                </button>


            </div>


            <div
                    class="resume-edit-section"
                    data-section-key="skills"
            >

                <!-- =================================================
                     SKILLS
                     ================================================= -->

                <h2 id="section-title-skills">
                    Technical Skills
                </h2>


                <div id="skillsContainer">


                    <div class="item"
                         th:each="skill,stat : *{skills}">


                        <div class="two-column">


                            <div class="form-group">

                                <label>
                                    Category
                                </label>

                                <input type="text"
                                       th:field="*{skills[__${stat.index}__].category}"
                                       placeholder="Programming Languages">

                            </div>


                            <div class="form-group">

                                <label>
                                    Skills
                                </label>

                                <input type="text"
                                       th:field="*{skills[__${stat.index}__].skillValues}"
                                       placeholder="C, Java, Python, SQL">

                            </div>


                        </div>


                        <button type="button"
                                class="remove-button"
                                onclick="removeItem(this)">

                            Remove Skill

                        </button>


                    </div>


                </div>


                <button type="button"
                        onclick="addSkill()">

                    + Add Skill

                </button>


            </div>


            <div
                    class="resume-edit-section"
                    data-section-key="projects"
            >

                <!-- =================================================
                     PROJECTS
                     ================================================= -->

                <h2 id="section-title-projects">
                    Projects
                </h2>


                <div id="projectsContainer">


                    <div class="item"
                         th:each="project,stat : *{projects}">


                        <div class="form-group">

                            <label>
                                Project Name
                            </label>

                            <input type="text"
                                   th:field="*{projects[__${stat.index}__].projectName}"
                                   placeholder="Commercial Website with Stripe Payments">

                        </div>


                        <label>
                            Project Description
                        </label>


                        <div class="toolbar">

                            <button type="button"
                                    onclick="formatText('bold')">
                                B
                            </button>

                            <button type="button"
                                    onclick="formatText('italic')">
                                I
                            </button>

                            <button type="button"
                                    onclick="formatText('underline')">
                                U
                            </button>

                        </div>


                        <textarea
                                th:field="*{projects[__${stat.index}__].description}"
                                rows="7"
                                placeholder="Describe the project...">
                </textarea>


                        <button type="button"
                                class="remove-button"
                                onclick="removeItem(this)">

                            Remove Project

                        </button>


                    </div>


                </div>


                <button type="button"
                        onclick="addProject()">

                    + Add Project

                </button>


            </div>


            <div
                    class="resume-edit-section"
                    data-section-key="certifications"
            >

                <!-- =================================================
                     CERTIFICATIONS
                     ================================================= -->

                <h2 id="section-title-certifications">
                    Certifications
                </h2>


                <div id="certificationsContainer">


                    <div class="item"
                         th:each="certification,stat : *{certifications}">


                        <div class="two-column">


                            <div class="form-group">

                                <label>
                                    Certification Name
                                </label>

                                <input type="text"
                                       th:field="*{certifications[__${stat.index}__].name}"
                                       placeholder="Java Spring Boot Full Stack">

                            </div>


                            <div class="form-group">

                                <label>
                                    Organization
                                </label>

                                <input type="text"
                                       th:field="*{certifications[__${stat.index}__].organization}"
                                       placeholder="Udemy">

                            </div>


                        </div>


                        <div class="form-group">

                            <label>
                                Date
                            </label>

                            <input type="text"
                                   th:field="*{certifications[__${stat.index}__].date}"
                                   placeholder="June 2025">

                        </div>


                        <button type="button"
                                class="remove-button"
                                onclick="removeItem(this)">

                            Remove Certification

                        </button>


                    </div>


                </div>


                <button type="button"
                        onclick="addCertification()">

                    + Add Certification

                </button>


            </div>


        </div>


        <!-- =================================================
             ACTIONS
             ================================================= -->

        <div class="actions">


            <button type="submit"
                    class="save-button">

                Save Resume

            </button>


            <button type="button"
                    class="preview-button"
                    onclick="previewResume()">

                Preview Resume

            </button>


            <a href="/"
               class="button">

                Cancel

            </a>


        </div>


    </form>


</div>


<script>

    /* =====================================================
       FORMAT TEXT
       ===================================================== */

    function formatText(command) {

        document.execCommand(command, false, null);
    }


    /* =====================================================
       PROFESSIONAL SUMMARY SYNC
       ===================================================== */

    const summaryEditor =
        document.getElementById("summaryEditor");

    const summaryHidden =
        document.getElementById("summaryHidden");


    /*
     * Load the value already stored in the Resume entity into the
     * contenteditable editor when opening the form for editing.
     *
     * The Thymeleaf-bound textarea is intentionally hidden, but it is
     * the source of truth for Spring MVC form binding.
     */
    function loadProfessionalSummary() {

        if (!summaryEditor || !summaryHidden) {
            return;
        }

        const savedValue =
            summaryHidden.value || "";

        summaryEditor.innerHTML = savedValue;

        updateSummaryPlaceholder();
    }


    /*
     * Keep the editor looking like an empty field when there is no
     * professional summary. The placeholder is not submitted.
     */
    function updateSummaryPlaceholder() {

        if (!summaryEditor) {
            return;
        }

        if (summaryEditor.innerHTML.trim() === "") {
            summaryEditor.classList.add("empty");
        } else {
            summaryEditor.classList.remove("empty");
        }
    }


    /*
     * Save the editor content into the actual Spring-bound field.
     */
    function syncProfessionalSummary() {

        if (!summaryEditor || !summaryHidden) {
            return;
        }

        summaryHidden.value =
            summaryEditor.innerHTML.trim();
    }


    if (summaryEditor) {

        summaryEditor.addEventListener(
            "input",
            function () {

                syncProfessionalSummary();
                updateSummaryPlaceholder();

            }
        );

        summaryEditor.addEventListener(
            "blur",
            updateSummaryPlaceholder
        );
    }


    document
        .getElementById("resumeForm")
        .addEventListener("submit", function () {

            syncProfessionalSummary();

        });


    /* Load the existing summary as soon as the page is ready. */
    loadProfessionalSummary();


    /* =====================================================
       REMOVE ITEM
       ===================================================== */

    function removeItem(button) {

        const item =
            button.parentElement;

        item.remove();
    }


    /* =====================================================
       EDUCATION
       ===================================================== */

    let educationIndex =
        document.querySelectorAll(
            "#educationContainer .education-item"
        ).length;


    function addEducation() {

        const container =
            document.getElementById(
                "educationContainer"
            );


        const div =
            document.createElement("div");


        div.className = "item education-item";


        div.innerHTML = `

            <h3>
                Education
            </h3>

            <div class="form-group">

                <label>
                    Degree
                </label>

                <input
                    type="text"
                    name="educations[${educationIndex}].degree"
                    placeholder="B.Tech / M.Tech / Diploma">

            </div>

            <div class="form-group">

                <label>
                    Institution
                </label>

                <input
                    type="text"
                    name="educations[${educationIndex}].institution"
                    placeholder="College / University">

            </div>

            <div class="two-column">

                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        name="educations[${educationIndex}].location"
                        placeholder="Solapur">

                </div>

                <div class="form-group">

                    <label>
                        Score
                    </label>

                    <input
                        type="text"
                        name="educations[${educationIndex}].score"
                        placeholder="CGPA: 7.5/10">

                </div>

            </div>

            <div class="two-column">

                <div class="form-group">

                    <label>
                        Start Year
                    </label>

                    <input
                        type="text"
                        name="educations[${educationIndex}].startYear"
                        placeholder="2021">

                </div>

                <div class="form-group">

                    <label>
                        End Year
                    </label>

                    <input
                        type="text"
                        name="educations[${educationIndex}].endYear"
                        placeholder="2024">

                </div>

            </div>

            <button
                type="button"
                class="remove-button"
                onclick="removeItem(this)">

                Remove Education

            </button>

        `;


        container.appendChild(div);

        educationIndex++;
    }


    /* =====================================================
       SKILLS
       ===================================================== */

    let skillIndex =
        document.querySelectorAll(
            "#skillsContainer .item"
        ).length;


    function addSkill() {

        const container =
            document.getElementById(
                "skillsContainer"
            );


        const div =
            document.createElement("div");


        div.className = "item";


        div.innerHTML = `

            <div class="two-column">

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        name="skills[${skillIndex}].category"
                        placeholder="Web Technologies">

                </div>

                <div class="form-group">

                    <label>
                        Skills
                    </label>

                    <input
                        type="text"
                        name="skills[${skillIndex}].skillValues"
                        placeholder="HTML, CSS, JavaScript">

                </div>

            </div>

            <button
                type="button"
                class="remove-button"
                onclick="removeItem(this)">

                Remove Skill

            </button>

        `;


        container.appendChild(div);

        skillIndex++;

    /* =====================================================
       RESUME SECTION MANAGER
       ===================================================== */

    let draggedSection = null;


    function initializeSectionManager() {

        const manager =
            document.getElementById(
                "sectionManager"
            );


        if (!manager) {
            return;
        }


        const items =
            manager.querySelectorAll(
                ".section-manager-item"
            );


        items.forEach(
            function (item) {

                item.addEventListener(
                    "dragstart",
                    function () {

                        draggedSection = item;

                        item.classList.add(
                            "dragging"
                        );
                    }
                );


                item.addEventListener(
                    "dragend",
                    function () {

                        item.classList.remove(
                            "dragging"
                        );

                        draggedSection = null;

                        updateSectionOrder();

                        reorderResumeSections();
                    }
                );


                item.addEventListener(
                    "dragover",
                    function (event) {

                        event.preventDefault();


                        if (
                            !draggedSection
                            ||
                            draggedSection === item
                        ) {
                            return;
                        }


                        const rect =
                            item.getBoundingClientRect();


                        const middle =
                            rect.top +
                            (rect.height / 2);


                        if (
                            event.clientY < middle
                        ) {

                            manager.insertBefore(
                                draggedSection,
                                item
                            );

                        } else {

                            manager.insertBefore(
                                draggedSection,
                                item.nextSibling
                            );
                        }
                    }
                );
            }
        );


        restoreSavedSectionOrder();

        updateSectionOrder();

        reorderResumeSections();
    }


    function restoreSavedSectionOrder() {

        const manager =
            document.getElementById(
                "sectionManager"
            );


        const hiddenInput =
            document.getElementById(
                "sectionOrder"
            );


        if (!manager || !hiddenInput) {
            return;
        }


        const savedOrder =
            hiddenInput.value;


        if (
            !savedOrder
            ||
            savedOrder.trim() === ""
        ) {
            return;
        }


        const order =
            savedOrder
                .split(",")
                .map(
                    function (value) {
                        return value.trim();
                    }
                )
                .filter(
                    function (value) {
                        return value.length > 0;
                    }
                );


        order.forEach(
            function (sectionKey) {

                const item =
                    manager.querySelector(
                        '[data-section-key="' +
                        sectionKey +
                        '"]'
                    );


                if (item) {
                    manager.appendChild(item);
                }
            }
        );
    }


    function updateSectionOrder() {

        const manager =
            document.getElementById(
                "sectionManager"
            );


        const hiddenInput =
            document.getElementById(
                "sectionOrder"
            );


        if (!manager || !hiddenInput) {
            return;
        }


        const items =
            manager.querySelectorAll(
                ".section-manager-item"
            );


        const order =
            Array.from(items)
                .map(
                    function (item) {
                        return item.dataset.sectionKey;
                    }
                )
                .join(",");


        hiddenInput.value = order;
    }


    function reorderResumeSections() {

        const manager =
            document.getElementById(
                "sectionManager"
            );


        const sectionsContainer =
            document.getElementById(
                "resumeSectionsContainer"
            );


        if (!manager || !sectionsContainer) {
            return;
        }


        const items =
            manager.querySelectorAll(
                ".section-manager-item"
            );


        items.forEach(
            function (item) {

                const sectionKey =
                    item.dataset.sectionKey;


                const section =
                    sectionsContainer.querySelector(
                        '.resume-edit-section[data-section-key="' +
                        sectionKey +
                        '"]'
                    );


                if (section) {
                    sectionsContainer.appendChild(
                        section
                    );
                }
            }
        );
    }


    function updateSectionTitle(
        sectionKey,
        value
    ) {

        const title =
            document.getElementById(
                "section-title-" +
                sectionKey
            );


        if (!title) {
            return;
        }


        const defaultTitles = {

            summary:
                "Professional Summary",

            education:
                "Education",

            skills:
                "Technical Skills",

            projects:
                "Projects",

            certifications:
                "Certifications"
        };


        const cleanValue =
            value.trim();


        title.textContent =
            cleanValue.length > 0
                ? cleanValue
                : defaultTitles[sectionKey];
    }


    function initializeSectionTitleInputs() {

        const fields = [

            {
                id: "summaryTitle",
                key: "summary"
            },

            {
                id: "educationTitle",
                key: "education"
            },

            {
                id: "skillsTitle",
                key: "skills"
            },

            {
                id: "projectsTitle",
                key: "projects"
            },

            {
                id: "certificationsTitle",
                key: "certifications"
            }
        ];


        fields.forEach(
            function (field) {

                const input =
                    document.getElementById(
                        field.id
                    );


                if (!input) {
                    return;
                }


                input.addEventListener(
                    "input",
                    function () {

                        updateSectionTitle(
                            field.key,
                            input.value
                        );
                    }
                );


                updateSectionTitle(
                    field.key,
                    input.value
                );
            }
        );
    }


    function prepareSectionDataBeforeSubmit() {

        updateSectionOrder();

        reorderResumeSections();
    }


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            initializeSectionManager();

            initializeSectionTitleInputs();


            const form =
                document.getElementById(
                    "resumeForm"
                );


            if (form) {

                form.addEventListener(
                    "submit",
                    function () {

                        syncProfessionalSummary();

                        prepareSectionDataBeforeSubmit();
                    }
                );
            }
        }
    );


    /* =====================================================
       PREVIEW
       ===================================================== */

    function previewResume() {

        const form =
            document.getElementById("resumeForm");


        // Synchronize the rich-text Professional Summary before
        // submitting. form.submit() bypasses the normal submit event,
        // so this must be done explicitly here.
        syncProfessionalSummary();


        // Synchronize section order before preview.
        updateSectionOrder();

        reorderResumeSections();


        // Save first, then the controller redirects
        // to the preview page.

        form.submit();
    }

</script>
