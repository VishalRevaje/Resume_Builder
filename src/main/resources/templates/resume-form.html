<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resume Form</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px;

            background: #f2f2f2;

            font-family: Arial, sans-serif;
        }


        .container {

            max-width: 1000px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 8px;
        }


        h1 {

            margin-top: 0;
        }


        h2 {

            margin-top: 35px;

            border-bottom: 1px solid #ddd;

            padding-bottom: 8px;
        }


        h3 {

            margin-top: 10px;
        }


        .form-group {

            margin-bottom: 15px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 5px;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 9px;

            border: 1px solid #ccc;

            border-radius: 4px;

            font-size: 14px;
        }


        textarea {

            min-height: 120px;

            resize: vertical;
        }


        .two-column {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        .three-column {

            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            gap: 15px;
        }


        .item {

            border: 1px solid #ddd;

            padding: 20px;

            margin-bottom: 15px;

            border-radius: 5px;

            background: #fafafa;
        }


        button,
        .button {

            padding: 9px 16px;

            border: none;

            border-radius: 4px;

            background: #333;

            color: white;

            cursor: pointer;

            text-decoration: none;

            display: inline-block;

            font-size: 14px;
        }


        button:hover,
        .button:hover {

            background: #555;
        }


        .remove-button {

            background: #b00020;

            margin-top: 10px;
        }


        .toolbar {

            display: flex;

            gap: 5px;

            margin-bottom: 8px;
        }


        .toolbar button {

            padding: 6px 10px;

            font-weight: bold;

            background: #555;
        }


        .editor {

            min-height: 150px;

            border: 1px solid #ccc;

            border-radius: 4px;

            padding: 12px;

            background: white;
        }


        .editor.empty::before {

            content: attr(data-placeholder);

            color: #888;

            pointer-events: none;
        }


        .actions {

            margin-top: 30px;

            display: flex;

            gap: 10px;
        }


        .save-button {

            background: #1976d2;
        }


        .preview-button {

            background: #388e3c;
        }


        @media(max-width: 700px) {

            .two-column,
            .three-column {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Resume Builder
    </h1>


    <form th:action="@{/resumes/save}"
          th:object="${resume}"
          method="post"
          id="resumeForm">


        <!-- =================================================
             PERSONAL INFORMATION
             ================================================= -->

        <h2>
            Personal Information
        </h2>


        <div class="two-column">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input type="text"
                       th:field="*{fullName}"
                       placeholder="Vishal Revaje"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input type="text"
                       th:field="*{location}"
                       placeholder="Solapur, Maharashtra">

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input type="email"
                       th:field="*{email}"
                       placeholder="revajevishal39@gmail.com">

            </div>


            <div class="form-group">

                <label>
                    Mobile
                </label>

                <input type="text"
                       th:field="*{mobile}"
                       placeholder="+91 9579906987">

            </div>


            <div class="form-group">

                <label>
                    LinkedIn
                </label>

                <input type="text"
                       th:field="*{linkedin}"
                       placeholder="linkedin.com/in/vishal-revaje-3b513622a">

            </div>


            <div class="form-group">

                <label>
                    GitHub
                </label>

                <input type="text"
                       th:field="*{github}"
                       placeholder="github.com/VishalRevaje">

            </div>


        </div>


        <!-- =================================================
             FONT SETTINGS
             ================================================= -->

        <h2>
            Resume Formatting
        </h2>


        <div class="two-column">


            <div class="form-group">

                <label>
                    Font Name
                </label>

                <select th:field="*{fontFamily}">

                    <option value="Arial">
                        Arial
                    </option>

                    <option value="Calibri">
                        Calibri
                    </option>

                    <option value="Times New Roman">
                        Times New Roman
                    </option>

                    <option value="Georgia">
                        Georgia
                    </option>

                    <option value="Verdana">
                        Verdana
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Font Size
                </label>

                <select th:field="*{fontSize}">

                    <option value="9">
                        9
                    </option>

                    <option value="10">
                        10
                    </option>

                    <option value="11">
                        11
                    </option>

                    <option value="12">
                        12
                    </option>

                    <option value="13">
                        13
                    </option>

                    <option value="14">
                        14
                    </option>

                </select>

            </div>


        </div>


        <!-- =================================================
             PROFESSIONAL SUMMARY
             ================================================= -->

        <h2>
            Professional Summary
        </h2>


        <div class="toolbar">

            <button type="button"
                    onclick="formatText('bold')">

                B

            </button>


            <button type="button"
                    onclick="formatText('italic')">

                I

            </button>


            <button type="button"
                    onclick="formatText('underline')">

                U

            </button>


        </div>


        <!-- Visible rich-text editor. The actual submitted value is kept
             in summaryHidden and synchronized before the form is submitted. -->
        <div id="summaryEditor"
             class="editor"
             contenteditable="true"
             role="textbox"
             aria-multiline="true"
             data-placeholder="Write your professional summary here..."></div>


        <!-- Spring/Thymeleaf-bound field. This is the field that is saved
             to Resume.professionalSummary. -->
        <textarea id="summaryHidden"
                  th:field="*{professionalSummary}"
                  style="display:none;"></textarea>


        <!-- =================================================
             EDUCATION
             ================================================= -->

        <h2>
            Education
        </h2>


        <div id="educationContainer">


            <div class="item education-item"
                 th:each="education,stat : *{educations}">


                <h3>
                    Education
                </h3>


                <div class="form-group">

                    <label>
                        Degree
                    </label>

                    <input type="text"
                           th:field="*{educations[__${stat.index}__].degree}"
                           placeholder="B.Tech in Electronics & Telecommunication Engineering">

                </div>


                <div class="form-group">

                    <label>
                        Institution
                    </label>

                    <input type="text"
                           th:field="*{educations[__${stat.index}__].institution}"
                           placeholder="N.K. Orchid College of Engineering">

                </div>


                <div class="two-column">


                    <div class="form-group">

                        <label>
                            Location
                        </label>

                        <input type="text"
                               th:field="*{educations[__${stat.index}__].location}"
                               placeholder="Solapur">

                    </div>


                    <div class="form-group">

                        <label>
                            Score
                        </label>

                        <input type="text"
                               th:field="*{educations[__${stat.index}__].score}"
                               placeholder="CGPA: 7.03/10">

                    </div>


                </div>


                <div class="two-column">


                    <div class="form-group">

                        <label>
                            Start Year
                        </label>

                        <input type="text"
                               th:field="*{educations[__${stat.index}__].startYear}"
                               placeholder="2021">

                    </div>


                    <div class="form-group">

                        <label>
                            End Year
                        </label>

                        <input type="text"
                               th:field="*{educations[__${stat.index}__].endYear}"
                               placeholder="2024">

                    </div>


                </div>


                <button type="button"
                        class="remove-button"
                        onclick="removeItem(this)">

                    Remove Education

                </button>


            </div>


        </div>


        <button type="button"
                onclick="addEducation()">

            + Add Education

        </button>


        <!-- =================================================
             SKILLS
             ================================================= -->

        <h2>
            Technical Skills
        </h2>


        <div id="skillsContainer">


            <div class="item"
                 th:each="skill,stat : *{skills}">


                <div class="two-column">


                    <div class="form-group">

                        <label>
                            Category
                        </label>

                        <input type="text"
                               th:field="*{skills[__${stat.index}__].category}"
                               placeholder="Programming Languages">

                    </div>


                    <div class="form-group">

                        <label>
                            Skills
                        </label>

                        <input type="text"
                               th:field="*{skills[__${stat.index}__].skillValues}"
                               placeholder="C, Java, Python, SQL">

                    </div>


                </div>


                <button type="button"
                        class="remove-button"
                        onclick="removeItem(this)">

                    Remove Skill

                </button>


            </div>


        </div>


        <button type="button"
                onclick="addSkill()">

            + Add Skill

        </button>


        <!-- =================================================
             PROJECTS
             ================================================= -->

        <h2>
            Projects
        </h2>


        <div id="projectsContainer">


            <div class="item"
                 th:each="project,stat : *{projects}">


                <div class="form-group">

                    <label>
                        Project Name
                    </label>

                    <input type="text"
                           th:field="*{projects[__${stat.index}__].projectName}"
                           placeholder="Commercial Website with Stripe Payments">

                </div>


                <label>
                    Project Description
                </label>


                <div class="toolbar">

                    <button type="button"
                            onclick="formatText('bold')">
                        B
                    </button>

                    <button type="button"
                            onclick="formatText('italic')">
                        I
                    </button>

                    <button type="button"
                            onclick="formatText('underline')">
                        U
                    </button>

                </div>


                <textarea
                        th:field="*{projects[__${stat.index}__].description}"
                        rows="7"
                        placeholder="Describe the project...">
                </textarea>


                <button type="button"
                        class="remove-button"
                        onclick="removeItem(this)">

                    Remove Project

                </button>


            </div>


        </div>


        <button type="button"
                onclick="addProject()">

            + Add Project

        </button>


        <!-- =================================================
             CERTIFICATIONS
             ================================================= -->

        <h2>
            Certifications
        </h2>


        <div id="certificationsContainer">


            <div class="item"
                 th:each="certification,stat : *{certifications}">


                <div class="two-column">


                    <div class="form-group">

                        <label>
                            Certification Name
                        </label>

                        <input type="text"
                               th:field="*{certifications[__${stat.index}__].name}"
                               placeholder="Java Spring Boot Full Stack">

                    </div>


                    <div class="form-group">

                        <label>
                            Organization
                        </label>

                        <input type="text"
                               th:field="*{certifications[__${stat.index}__].organization}"
                               placeholder="Udemy">

                    </div>


                </div>


                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input type="text"
                           th:field="*{certifications[__${stat.index}__].date}"
                           placeholder="June 2025">

                </div>


                <button type="button"
                        class="remove-button"
                        onclick="removeItem(this)">

                    Remove Certification

                </button>


            </div>


        </div>


        <button type="button"
                onclick="addCertification()">

            + Add Certification

        </button>


        <!-- =================================================
             ACTIONS
             ================================================= -->

        <div class="actions">


            <button type="button"
                    class="preview-button"
                    onclick="previewResume()">

                Preview Resume

            </button>


            <button type="submit"
                    class="save-button">

                Save Resume

            </button>


            <a href="/"
               class="button">

                Cancel

            </a>


        </div>


    </form>


</div>


<script>

    /* =====================================================
       FORMAT TEXT
       ===================================================== */

    function formatText(command) {

        document.execCommand(command, false, null);
    }


    /* =====================================================
       PROFESSIONAL SUMMARY SYNC
       ===================================================== */

    const summaryEditor =
        document.getElementById("summaryEditor");

    const summaryHidden =
        document.getElementById("summaryHidden");


    /*
     * Load the value already stored in the Resume entity into the
     * contenteditable editor when opening the form for editing.
     *
     * The Thymeleaf-bound textarea is intentionally hidden, but it is
     * the source of truth for Spring MVC form binding.
     */
    function loadProfessionalSummary() {

        if (!summaryEditor || !summaryHidden) {
            return;
        }

        const savedValue =
            summaryHidden.value || "";

        summaryEditor.innerHTML = savedValue;

        updateSummaryPlaceholder();
    }


    /*
     * Keep the editor looking like an empty field when there is no
     * professional summary. The placeholder is not submitted.
     */
    function updateSummaryPlaceholder() {

        if (!summaryEditor) {
            return;
        }

        if (summaryEditor.innerHTML.trim() === "") {
            summaryEditor.classList.add("empty");
        } else {
            summaryEditor.classList.remove("empty");
        }
    }


    /*
     * Save the editor content into the actual Spring-bound field.
     */
    function syncProfessionalSummary() {

        if (!summaryEditor || !summaryHidden) {
            return;
        }

        summaryHidden.value =
            summaryEditor.innerHTML.trim();
    }


    if (summaryEditor) {

        summaryEditor.addEventListener(
            "input",
            updateSummaryPlaceholder
        );

        summaryEditor.addEventListener(
            "blur",
            updateSummaryPlaceholder
        );
    }


    document
        .getElementById("resumeForm")
        .addEventListener("submit", function () {

            syncProfessionalSummary();

        });


    /* Load the existing summary as soon as the page is ready. */
    loadProfessionalSummary();


    /* =====================================================
       REMOVE ITEM
       ===================================================== */

    function removeItem(button) {

        const item =
            button.parentElement;

        item.remove();
    }


    /* =====================================================
       EDUCATION
       ===================================================== */

    let educationIndex =
        document.querySelectorAll(
            "#educationContainer .education-item"
        ).length;


    function addEducation() {

        const container =
            document.getElementById(
                "educationContainer"
            );


        const div =
            document.createElement("div");


        div.className = "item education-item";


        div.innerHTML = `

            <h3>
                Education
            </h3>

            <div class="form-group">

                <label>
                    Degree
                </label>

                <input
                    type="text"
                    name="educations[${educationIndex}].degree"
                    placeholder="B.Tech / M.Tech / Diploma">

            </div>

            <div class="form-group">

                <label>
                    Institution
                </label>

                <input
                    type="text"
                    name="educations[${educationIndex}].institution"
                    placeholder="College / University">

            </div>

            <div class="two-column">

                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        name="educations[${educationIndex}].location"
                        placeholder="Solapur">

                </div>

                <div class="form-group">

                    <label>
                        Score
                    </label>

                    <input
                        type="text"
                        name="educations[${educationIndex}].score"
                        placeholder="CGPA: 7.5/10">

                </div>

            </div>

            <div class="two-column">

                <div class="form-group">

                    <label>
                        Start Year
                    </label>

                    <input
                        type="text"
                        name="educations[${educationIndex}].startYear"
                        placeholder="2021">

                </div>

                <div class="form-group">

                    <label>
                        End Year
                    </label>

                    <input
                        type="text"
                        name="educations[${educationIndex}].endYear"
                        placeholder="2024">

                </div>

            </div>

            <button
                type="button"
                class="remove-button"
                onclick="removeItem(this)">

                Remove Education

            </button>

        `;


        container.appendChild(div);

        educationIndex++;
    }


    /* =====================================================
       SKILLS
       ===================================================== */

    let skillIndex =
        document.querySelectorAll(
            "#skillsContainer .item"
        ).length;


    function addSkill() {

        const container =
            document.getElementById(
                "skillsContainer"
            );


        const div =
            document.createElement("div");


        div.className = "item";


        div.innerHTML = `

            <div class="two-column">

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        name="skills[${skillIndex}].category"
                        placeholder="Web Technologies">

                </div>

                <div class="form-group">

                    <label>
                        Skills
                    </label>

                    <input
                        type="text"
                        name="skills[${skillIndex}].skillValues"
                        placeholder="HTML, CSS, JavaScript">

                </div>

            </div>

            <button
                type="button"
                class="remove-button"
                onclick="removeItem(this)">

                Remove Skill

            </button>

        `;


        container.appendChild(div);

        skillIndex++;
    }


    /* =====================================================
       PROJECTS
       ===================================================== */

    let projectIndex =
        document.querySelectorAll(
            "#projectsContainer .item"
        ).length;


    function addProject() {

        const container =
            document.getElementById(
                "projectsContainer"
            );


        const div =
            document.createElement("div");


        div.className = "item";


        div.innerHTML = `

            <div class="form-group">

                <label>
                    Project Name
                </label>

                <input
                    type="text"
                    name="projects[${projectIndex}].projectName"
                    placeholder="Project Name">

            </div>

            <div class="form-group">

                <label>
                    Project Description
                </label>

                <textarea
                    name="projects[${projectIndex}].description"
                    rows="7"
                    placeholder="Describe the project..."></textarea>

            </div>

            <button
                type="button"
                class="remove-button"
                onclick="removeItem(this)">

                Remove Project

            </button>

        `;


        container.appendChild(div);

        projectIndex++;
    }


    /* =====================================================
       CERTIFICATIONS
       ===================================================== */

    let certificationIndex =
        document.querySelectorAll(
            "#certificationsContainer .item"
        ).length;


    function addCertification() {

        const container =
            document.getElementById(
                "certificationsContainer"
            );


        const div =
            document.createElement("div");


        div.className = "item";


        div.innerHTML = `

            <div class="two-column">

                <div class="form-group">

                    <label>
                        Certification Name
                    </label>

                    <input
                        type="text"
                        name="certifications[${certificationIndex}].name"
                        placeholder="Certification Name">

                </div>

                <div class="form-group">

                    <label>
                        Organization
                    </label>

                    <input
                        type="text"
                        name="certifications[${certificationIndex}].organization"
                        placeholder="Udemy / Coursera">

                </div>

            </div>

            <div class="form-group">

                <label>
                    Date
                </label>

                <input
                    type="text"
                    name="certifications[${certificationIndex}].date"
                    placeholder="June 2025">

            </div>

            <button
                type="button"
                class="remove-button"
                onclick="removeItem(this)">

                Remove Certification

            </button>

        `;


        container.appendChild(div);

        certificationIndex++;
    }


    /* =====================================================
       PREVIEW
       ===================================================== */

    function previewResume() {

        const form =
            document.getElementById("resumeForm");


        // Save first, then the controller redirects
        // to the preview page.

        form.submit();
    }

</script>


</body>

</html>
