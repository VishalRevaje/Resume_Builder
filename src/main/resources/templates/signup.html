<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Resume Builder</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f4f4f4;

            font-family: Arial, sans-serif;
        }


        .signup-container {

            width: 430px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                    0 5px 25px
                    rgba(0,0,0,0.12);
        }


        h1 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 30px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 5px;

            margin-bottom: 5px;

            font-size: 15px;
        }


        .error {

            display: block;

            color: #c00000;

            font-size: 13px;

            margin-bottom: 14px;
        }


        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 10px;
        }


        button:hover {

            background: #444;
        }


        .login-link {

            text-align: center;

            margin-top: 20px;
        }


        .login-link a {

            color: #222;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="signup-container">


    <h1>
        Create Account
    </h1>


    <form
            th:action="@{/signup}"
            th:object="${signupForm}"
            method="post">


        <label for="name">
            Name
        </label>


        <input
                type="text"
                id="name"
                th:field="*{name}"
                placeholder="Enter your name">


        <span
                class="error"
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}">
        </span>


        <label for="email">
            Email
        </label>


        <input
                type="email"
                id="email"
                th:field="*{email}"
                placeholder="Enter your email">


        <span
                class="error"
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}">
        </span>


        <label for="password">
            Password
        </label>


        <input
                type="password"
                id="password"
                th:field="*{password}"
                placeholder="Minimum 6 characters">


        <span
                class="error"
                th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}">
        </span>


        <label for="confirmPassword">
            Confirm Password
        </label>


        <input
                type="password"
                id="confirmPassword"
                th:field="*{confirmPassword}"
                placeholder="Enter password again">


        <span
                class="error"
                th:if="${#fields.hasErrors('confirmPassword')}"
                th:errors="*{confirmPassword}">
        </span>


        <button type="submit">

            Sign Up

        </button>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="/login">

            Login

        </a>

    </div>


</div>


</body>

</html>
